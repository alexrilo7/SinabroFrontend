<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="contenedor-formulario" style="max-width: 300px">
                <!-- Logo -->
                <div class="text-center logo-container">
                    <img src='assets/img/logo.png' class="img-fluid" style="max-width: 60px" alt="Logo" />
                </div>

                <!-- Formulario -->
                <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
                    <!-- Campo de usuario -->
                    <div class="input-group">
                        <span class="input-group-text">
                            <img src="assets/img/doctor.png" alt="Icono de usuario" class="img-fluid"
                                style="max-width: 20px; height: auto" />
                        </span>
                        <input type="text" class="form-control form-control-sm" id="usuario"
                        formControlName="username" placeholder="Nombre de usuario" />
                    </div>

                    <!-- Campo de contraseña -->
                    <div class="input-group">
                        <span class="input-group-text">
                            <img src="assets/img/candado.png" alt="Icono de contraseña" class="img-fluid"
                                style="max-width: 20px; height: auto" />
                        </span>
                        <input type="password" class="form-control form-control-sm" formControlName="password" id="password"
                            placeholder="Contraseña" />
                    </div>

                    <!-- Botón de login -->
                    <button type="submit" [disabled]="registroForm.invalid" class="btn btn-primary btn-sm w-100 mt-2">
                        Login
                    </button>

                    <!-- Enlace "¿Olvidaste tu contraseña?" -->
                    <div class="text-center mt-3">
                        <a href="recuperar-contraseña.html" class="enlace-contraseña">¿Olvidaste tu contraseña?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-100 fixed-bottom">
        <div class="container">
            <p class="m-0">
                &copy; 2023 Tu Empresa. Todos los derechos reservados.
            </p>
        </div>
    </footer>
</body>

</html>
